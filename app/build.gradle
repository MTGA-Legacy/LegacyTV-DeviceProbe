plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mtgalegacy.deviceprobe'
    compileSdk 36
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.mtgalegacy.deviceprobe'
        minSdk 19
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
            // The release artifact is intentionally unsigned. Actions also publishes the
            // debug-signed APK for direct installation on a TV.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
    }

    aaptOptions {
        noCompress 'mp4', 'm4a', 'mp3'
    }
}

dependencies {
    // No runtime libraries are required. Keeping the APK platform-only is useful on API 19.
}
